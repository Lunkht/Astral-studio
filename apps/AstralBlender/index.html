<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AstralBlender — 3D</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <!-- ======= MENU BAR ======= -->
  <div class="menubar">
    <span class="brand">AstralBlender</span>

    <div class="menu" data-menu>
      <button class="menu-title">Fichier</button>
      <div class="menu-drop">
        <button data-action="new">Nouveau<span class="k">Ctrl+N</span></button>
        <div class="sep"></div>
        <button data-action="export-png">Exporter le rendu (PNG)…</button>
        <button data-action="export-obj">Exporter la scene (OBJ)…</button>
      </div>
    </div>

    <div class="menu" data-menu>
      <button class="menu-title">Édition</button>
      <div class="menu-drop">
        <button data-action="undo">Annuler<span class="k">Ctrl+Z</span></button>
        <button data-action="redo">Rétablir<span class="k">Ctrl+Maj+Z</span></button>
        <div class="sep"></div>
        <button data-action="duplicate">Dupliquer<span class="k">Ctrl+D</span></button>
        <button data-action="delete">Supprimer<span class="k">Suppr</span></button>
      </div>
    </div>

    <div class="menu" data-menu>
      <button class="menu-title">Ajouter</button>
      <div class="menu-drop">
        <button data-action="add-cube">Cube</button>
        <button data-action="add-plane">Plan</button>
        <button data-action="add-sphere">Sphere</button>
        <button data-action="add-cylinder">Cylindre</button>
        <button data-action="add-cone">Cone</button>
        <button data-action="add-torus">Tore</button>
      </div>
    </div>

    <div class="menu" data-menu>
      <button class="menu-title">Affichage</button>
      <div class="menu-drop">
        <button data-action="shade-solid">Solide</button>
        <button data-action="shade-edges">Solide + arêtes</button>
        <button data-action="shade-wire">Filaire</button>
        <div class="sep"></div>
        <button data-action="toggle-grid">Afficher / masquer la grille</button>
        <button data-action="toggle-axes">Afficher / masquer les axes</button>
        <div class="sep"></div>
        <button data-action="view-front">Vue de face<span class="k">1</span></button>
        <button data-action="view-side">Vue de cote<span class="k">3</span></button>
        <button data-action="view-top">Vue de dessus<span class="k">7</span></button>
        <button data-action="frame">Cadrer la scene<span class="k">Origine</span></button>
      </div>
    </div>

    <div class="menu" data-menu>
      <button class="menu-title">Aide</button>
      <div class="menu-drop">
        <button data-action="about">À propos d'AstralBlender</button>
      </div>
    </div>

    <div class="menubar-spacer"></div>
    <input id="sceneName" class="doc-name" type="text" value="Scene" spellcheck="false" />
  </div>

  <!-- ======= CONTROL BAR ======= -->
  <div class="controlbar">
    <div class="cb-group cb-empty">
      <span class="cb-hint"><b>V</b> selection · <b>G</b> deplacer · orbite : bouton du milieu · molette : zoom · <b>Origine</b> : cadrer</span>
    </div>

    <div class="cb-group">
      <label class="cb-field"><span>Mode</span>
        <select id="shadeSel" class="cb-select">
          <option value="solid">Solide</option>
          <option value="edges">Solide + arêtes</option>
          <option value="wireframe">Filaire</option>
        </select>
      </label>
    </div>

    <div class="menubar-spacer"></div>

    <div class="cb-group cb-history">
      <button class="icon-btn" id="undoBtn" title="Annuler">&#8630;</button>
      <button class="icon-btn" id="redoBtn" title="Rétablir">&#8631;</button>
    </div>

    <div class="cb-group cb-view">
      <button class="mini" data-action="view-front">Face</button>
      <button class="mini" data-action="view-side">Cote</button>
      <button class="mini" data-action="view-top">Dessus</button>
      <button class="mini" data-action="frame">Cadrer</button>
    </div>

    <div class="cb-group cb-zoom">
      <span class="zval" id="distVal">8.0</span>
    </div>
  </div>

  <!-- ======= MAIN ======= -->
  <div class="main">

    <!-- LEFT TOOL RAIL -->
    <aside class="toolrail" role="toolbar" aria-label="Outils" aria-orientation="vertical">
      <div class="tool-grid">
        <button class="tool" data-tool="select" title="Selection (V)">
          <svg viewBox="0 0 24 24"><path d="M6 3l13 8-5.5 1.5L11 18z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="move" title="Deplacer (G)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="orbit" title="Orbite (O)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
        <button class="tool" data-tool="pan" title="Panoramique (H)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="tool" data-tool="zoom" title="Zoom (Z)">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 20 20M11 8.5v5M8.5 11h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
    </aside>

    <!-- WORKSPACE -->
    <div class="workspace" id="workspace">
      <canvas id="canvas" tabindex="0" role="application" aria-label="Vue 3D"></canvas>
    </div>

    <!-- RIGHT DOCK -->
    <aside class="dock" id="dock">

      <section class="panel" data-panel="add">
        <header class="panel-head"><span>Ajouter</span><button class="collapse">▾</button></header>
        <div class="panel-body">
          <div class="add-grid">
            <button class="mini" data-add="cube">Cube</button>
            <button class="mini" data-add="plane">Plan</button>
            <button class="mini" data-add="sphere">Sphère</button>
            <button class="mini" data-add="cylinder">Cylindre</button>
            <button class="mini" data-add="cone">Cône</button>
            <button class="mini" data-add="torus">Tore</button>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="scene">
        <header class="panel-head"><span>Scène</span><button class="collapse">▾</button></header>
        <div class="panel-body">
          <div class="objects" id="objList"></div>
        </div>
      </section>

      <section class="panel" data-panel="transform">
        <header class="panel-head"><span>Transform</span><button class="collapse">▾</button></header>
        <div class="panel-body">
          <p class="empty" id="xfEmpty">Aucun objet sélectionné.</p>
          <div id="xfBody" style="display:none">
            <div class="appr-row"><span class="appr-label">Nom</span><input id="objName" class="tiny-num wide" type="text" /></div>
            <div class="appr-row"><span class="appr-label">Position</span>
              <input id="px" class="tiny-num" type="number" step="0.1" /><input id="py" class="tiny-num" type="number" step="0.1" /><input id="pz" class="tiny-num" type="number" step="0.1" />
            </div>
            <div class="appr-row"><span class="appr-label">Rotation °</span>
              <input id="rx" class="tiny-num" type="number" step="1" /><input id="ry" class="tiny-num" type="number" step="1" /><input id="rz" class="tiny-num" type="number" step="1" />
            </div>
            <div class="appr-row"><span class="appr-label">Échelle</span>
              <input id="sx" class="tiny-num" type="number" step="0.1" /><input id="sy" class="tiny-num" type="number" step="0.1" /><input id="sz" class="tiny-num" type="number" step="0.1" />
            </div>
            <div class="appr-row"><span class="appr-label">Couleur</span><input id="objColor" type="color" /></div>
          </div>
        </div>
      </section>

      <section class="panel" data-panel="view">
        <header class="panel-head"><span>Affichage</span><button class="collapse">▾</button></header>
        <div class="panel-body">
          <label class="check"><input type="checkbox" id="edgesChk" /> Arêtes</label>
          <label class="check"><input type="checkbox" id="gridChk" /> Grille</label>
          <label class="check"><input type="checkbox" id="axesChk" /> Axes</label>
        </div>
      </section>

    </aside>
  </div>

  <!-- ======= STATUS ======= -->
  <footer class="statusbar">
    <span id="statusLeft">Prêt</span>
    <span class="spacer"></span>
    <span id="statusObjects">0 objet</span>
    <span id="statusSel">aucune sélection</span>
    <span id="statusDist">distance 8.0</span>
  </footer>
</div>

<!-- ======= GENERIC MODAL ======= -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-panel">
    <header class="modal-head"><h2 id="modalTitle">Titre</h2><button class="dd-close" id="modalClose">&#215;</button></header>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="dd-cancel" id="modalCancel">Fermer</button>
      <button class="dd-create" id="modalOk">OK</button>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/vec.js"></script>
<script src="js/mat4.js"></script>
<script src="js/mesh.js"></script>
<script src="js/scene.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
<script src="js/render.js"></script>
<script src="js/interaction.js"></script>
<script src="js/ui.js"></script>
<script src="js/export.js"></script>
<script src="js/main.js"></script>
</body>
</html>
